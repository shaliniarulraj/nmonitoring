<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Security Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #10b981;
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .stat-change {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .stat-change.positive {
      background: #dcfce7;
      color: #16a34a;
    }

    .stat-change.negative {
      background: #fee2e2;
      color: #dc2626;
    }

    .stat-change.warning {
      background: #fef3c7;
      color: #d97706;
    }

    .stat-change.critical {
      background: #fee2e2;
      color: #dc2626;
      animation: pulse-warning 2s infinite;
    }

    @keyframes pulse-warning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chart-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
    }

    .chart-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .alert-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .alert-header {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .alert-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      border-radius: 8px;
      margin-bottom: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .alert-icon {
      font-size: 24px;
    }

    .alert-content {
      flex: 1;
    }

    .alert-title {
      font-weight: 600;
      color: #991b1b;
      margin-bottom: 4px;
    }

    .alert-time {
      font-size: 12px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <span></span>
        Network Security Dashboard
      </h1>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Live Monitoring</span>
      </div>
    </header>

    <div class="grid">
      <div class="stat-card">
        <h3>Total Packets</h3>
        <div class="stat-value" id="totalPackets">0</div>
        <span class="stat-change positive">↑ Live</span>
      </div>
      <div class="stat-card">
        <h3>Anomalies Detected</h3>
        <div class="stat-value" id="anomalyCount">0</div>
        <span class="stat-change negative" id="anomalyChange">↑ 0 new</span>
      </div>
      <div class="stat-card">
        <h3>Avg Packet Size</h3>
        <div class="stat-value" id="avgSize">0 <span style="font-size: 16px;">bytes</span></div>
        <span class="stat-change positive">Normal</span>
      </div>
      <div class="stat-card">
        <h3>Detection Rate</h3>
        <div class="stat-value" id="detectionRate">0<span style="font-size: 16px;">%</span></div>
        <span class="stat-change positive" id="detectionStatus">✓ Healthy</span>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-header">
        <h2 class="chart-title">Real-Time Traffic Analysis</h2>
        <div class="chart-controls">
          <button class="btn btn-secondary" onclick="toggleChartType()">Toggle View</button>
          <button class="btn btn-primary" onclick="fetchData()">Refresh Now</button>
        </div>
      </div>
      <canvas id="trafficChart" height="80"></canvas>
    </div>

    <div class="alert-section">
      <h2 class="alert-header">Recent Anomaly Alerts</h2>
      <div class="alert-list" id="alertList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Monitoring for anomalies...</p>
        </div>
      </div>
    </div>

    <div class="alert-section" style="margin-top: 25px;">
      <h2 class="alert-header">📧 Email Alert Log</h2>
      <div class="alert-list" id="emailLogList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading email log...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let chartType = 'line';
    let previousAnomalyCount = 0;
    let alerts = [];
    
    const ctx = document.getElementById('trafficChart').getContext('2d');
    const trafficChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Packet Size',
          data: [],
          borderColor: '#667eea',
          backgroundColor: 'rgba(102, 126, 234, 0.1)',
          borderWidth: 3,
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointHoverRadius: 6
        }, {
          label: 'Anomaly Detected',
          data: [],
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          borderWidth: 3,
          borderDash: [5, 5],
          fill: true,
          tension: 0.4,
          pointRadius: 6,
          pointHoverRadius: 8,
          pointStyle: 'triangle'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: {
              usePointStyle: true,
              padding: 20,
              font: {
                size: 14,
                weight: '600'
              }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(0, 0, 0, 0.8)',
            padding: 12,
            titleFont: {
              size: 14,
              weight: 'bold'
            },
            bodyFont: {
              size: 13
            },
            cornerRadius: 8
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(0, 0, 0, 0.05)'
            },
            ticks: {
              font: {
                size: 12
              }
            }
          },
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 12
              },
              maxRotation: 45,
              minRotation: 45
            }
          }
        }
      }
    });

    function toggleChartType() {
      chartType = chartType === 'line' ? 'bar' : 'line';
      trafficChart.config.type = chartType;
      trafficChart.update();
    }

    function updateStats(data) {
      const totalPackets = data.values.length;
      const anomalyCount = data.anomalies.filter(a => a === -1).length;
      const avgSize = data.values.length > 0 
        ? Math.round(data.values.reduce((a, b) => a + b, 0) / data.values.length)
        : 0;
      const detectionRate = totalPackets > 0 
        ? Math.round((anomalyCount / totalPackets) * 100)
        : 0;

      document.getElementById('totalPackets').textContent = totalPackets;
      document.getElementById('anomalyCount').textContent = anomalyCount;
      document.getElementById('avgSize').innerHTML = `${avgSize} <span style="font-size: 16px;">bytes</span>`;
      document.getElementById('detectionRate').innerHTML = `${detectionRate}<span style="font-size: 16px;">%</span>`;

      // Dynamic detection rate status
      const detectionStatus = document.getElementById('detectionStatus');
      if (detectionRate === 0) {
        detectionStatus.textContent = '✓ Perfect';
        detectionStatus.className = 'stat-change positive';
      } else if (detectionRate <= 5) {
        detectionStatus.textContent = '✓ Healthy';
        detectionStatus.className = 'stat-change positive';
      } else if (detectionRate <= 15) {
        detectionStatus.textContent = '⚠ Elevated';
        detectionStatus.className = 'stat-change warning';
      } else if (detectionRate <= 30) {
        detectionStatus.textContent = '⚠ Warning';
        detectionStatus.className = 'stat-change warning';
      } else {
        detectionStatus.textContent = '🚨 Critical';
        detectionStatus.className = 'stat-change critical';
      }

      const newAnomalies = anomalyCount - previousAnomalyCount;
      if (newAnomalies > 0) {
        document.getElementById('anomalyChange').textContent = `↑ ${newAnomalies} new`;
        document.getElementById('anomalyChange').className = 'stat-change negative';
      } else {
        document.getElementById('anomalyChange').textContent = '✓ No new';
        document.getElementById('anomalyChange').className = 'stat-change positive';
      }
      previousAnomalyCount = anomalyCount;
    }

    function updateAlerts(data) {
      data.anomalies.forEach((anomaly, index) => {
        if (anomaly === -1) {
          const alertExists = alerts.some(a => 
            a.time === data.labels[index] && a.size === data.values[index]
          );
          
          if (!alertExists) {
            alerts.unshift({
              time: data.labels[index],
              size: data.values[index],
              type: data.anomalyTypes ? data.anomalyTypes[index] : 'Anomalous Traffic Detected',
              timestamp: new Date().toLocaleTimeString()
            });
          }
        }
      });

      alerts = alerts.slice(0, 10); // Keep only latest 10 alerts

      const alertList = document.getElementById('alertList');
      if (alerts.length === 0) {
        alertList.innerHTML = '<div class="loading"><p>No anomalies detected yet. System is healthy! 🎉</p></div>';
      } else {
        alertList.innerHTML = alerts.map(alert => `
          <div class="alert-item">
            <div class="alert-icon"></div>
            <div class="alert-content">
              <div class="alert-title">${alert.type}</div>
              <div class="alert-time">Packet size: ${alert.size} bytes • Time: ${alert.time} • Detected at: ${alert.timestamp}</div>
            </div>
          </div>
        `).join('');
      }
    }

    async function fetchData() {
      try {
        const res = await fetch('/api/traffic');
        const data = await res.json();
        
        if (data.labels && data.labels.length > 0) {
          trafficChart.data.labels = data.labels;
          trafficChart.data.datasets[0].data = data.values;
          
          const anomalyValues = data.values.map((val, idx) => 
            data.anomalies[idx] === -1 ? val : null
          );
          trafficChart.data.datasets[1].data = anomalyValues;
          
          trafficChart.update();
          updateStats(data);
          updateAlerts(data);
        }
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    async function fetchEmailLog() {
      try {
        const res = await fetch('/api/email-log');
        const log = await res.json();
        const emailLogList = document.getElementById('emailLogList');
        if (log.length === 0) {
          emailLogList.innerHTML = '<div class="loading"><p>No email alerts sent yet.</p></div>';
        } else {
          emailLogList.innerHTML = log.map(entry => `
            <div class="alert-item">
              <div class="alert-icon"></div>
              <div class="alert-content">
                <div class="alert-title">${entry.type}</div>
                <div class="alert-time">Packet size: ${entry.size} bytes • Time: ${entry.time}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading email log:', error);
      }
    }

    setInterval(fetchData, 3000);
    setInterval(fetchEmailLog, 10000);
    fetchData();
    fetchEmailLog();
  </script>
</body>
</html>
